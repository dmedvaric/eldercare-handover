spring.application.name=handover-backend
server.port=8080
server.error.include-message=always

# In-memory H2 database: re-created and re-seeded with sample data on every start.
# Switch to PostgreSQL later by replacing these properties and the h2 dependency.
spring.datasource.url=jdbc:h2:mem:eldercare;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:eldercare, user: sa, empty password)
spring.h2.console.enabled=true
